# Candidate Odoo 20 procedure; static validation is not a real H run.
id: odoo_inventory_missing_reference
software: odoo
software_version: '20.0'
session_type: onboarding
title: Reconnaître une référence absente
reversible: true
max_attempts: 1
max_steps_per_attempt: 25
max_time_s_per_attempt: 240
parameters:
- name: missing_reference
  description: Référence à rechercher, absente de la fixture de ce cas.
  default: HACK-INCONNU-999
preconditions:
- Odoo 20 est ouvert et connecté avec holo-demo sur la société HACKATHON — Boutique Démo — DONNÉES FICTIVES.
- Un seul acteur contrôle le Mac ; l’opérateur a vérifié l’état initial de cette étape.
- L’opérateur a confirmé que {missing_reference} est absente de la fixture avant le passage.
objective: Chercher exactement {missing_reference} dans les produits ; si elle est absente, le signaler clairement
  sans créer de produit ni substituer un autre article.
planned_changes:
- Aucune modification métier ; navigation et lecture uniquement.
allowed_actions:
- Ouvrir Inventaire et la liste des produits.
- Utiliser une recherche exacte sur la référence interne et lire les résultats.
forbidden_actions:
- Quitter l’onglet Odoo, saisir des identifiants, agir dans une autre société ou lancer un reset.
- Envoyer un message, créer une facture ou un paiement, modifier un prix catalogue ou les droits.
- Créer, modifier, supprimer, archiver ou valider un enregistrement métier.
agent_instructions: 'Dans Inventaire de la société fictive, cherche exactement la référence {missing_reference}.

  Vérifie le champ ou filtre de référence interne utilisé et attends les résultats.

  Si aucune fiche ne correspond exactement, indique « référence introuvable », montre la recherche

  et demande à l’utilisateur de vérifier la référence. Si une fiche correspond, rapporte plutôt ce que tu observes.

  Ne choisis pas un produit ressemblant et ne crée aucun article.

  Si la recherche ne peut pas être réalisée, distingue cette erreur d’une recherche valide sans résultat.'
postcondition:
  description: Les observations suivantes sont vérifiées dans la seule base de démonstration.
  checks:
  - key: correct_company
    prompt: La société visible est HACKATHON — Boutique Démo — DONNÉES FICTIVES.
  - key: exact_search
    prompt: La recherche ou le filtre actif correspond exactement à la référence interne {missing_reference}.
  - key: no_match
    prompt: La liste filtrée ne contient aucun produit correspondant exactement à {missing_reference}.
  verification_instructions: 'Relis la recherche active et les résultats visibles. Une erreur de chargement n’est
    pas une liste vide valide. Ne crée pas un produit pour satisfaire le cas.

    Ne modifie ni ne valide aucun document. Une attente n’est pas une preuve : lis chaque valeur. Une preuve absente
    ou illisible produit false.'
escalation:
  when:
  - Un document, une valeur, la société ou la permission nécessaire ne peut pas être identifié sans ambiguïté.
  - La postcondition reste non vérifiée après cet unique essai.
  decision_expected: L’opérateur doit relire l’état de la démonstration avant toute reprise ; aucune correction
    hors du périmètre approuvé.
  default_category: unknown
