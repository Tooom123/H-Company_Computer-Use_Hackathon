[project]
name = "hcs-workspace"
version = "0.1.0"
description = "Workspace root for the customer-success assistant (H Company hackathon). Not a package."
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["agent", "backend"]

[tool.pytest.ini_options]
testpaths = ["agent/tests", "backend/tests"]
addopts = "--import-mode=importlib"
