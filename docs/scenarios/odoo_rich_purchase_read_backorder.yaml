# Rich Odoo v2.1: candidate read-only scenario, not evidence of a completed H run.
id: odoo_rich_purchase_read_backorder
software: odoo
software_version: '20.0'
session_type: onboarding
title: Trouver le bon reliquat sans le valider
reversible: true
max_attempts: 1
max_steps_per_attempt: 35
max_time_s_per_attempt: 300
parameters: []
preconditions:
- L’opérateur a ouvert et authentifié la démo enrichie v2.1 sur http://holo-rich.localhost:18091 ; aucun autre onglet
  Odoo ne doit être utilisé.
- La société visible est exactement Holo — Déjà Bu Démo · DONNÉES FICTIVES.
- Un seul acteur contrôle le Mac ; l’opérateur a relu l’identité des documents et leur état de référence.
- Ce cas est une lecture seule, indépendante des autres cas R01–R10 ; un manque de preuve doit être signalé, jamais
  réparé.
objective: Ouvrir et expliquer le reliquat existant de DEMO-ACHAT-029 sans le valider.
planned_changes:
- Aucune modification métier ; navigation, filtres temporaires et lecture uniquement.
allowed_actions:
- Naviguer dans les menus de la démo enrichie et ouvrir les fiches existantes nécessaires à cette seule question.
- Utiliser la recherche, les filtres temporaires, les liens entre documents et le défilement pour lire les valeurs.
forbidden_actions:
- Quitter l’onglet holo-rich.localhost:18091, ouvrir une autre origine Odoo, saisir des identifiants ou changer
  de société.
- Créer, modifier, supprimer, archiver, confirmer, valider, réserver ou clôturer un enregistrement métier.
- Déplacer une carte ou un événement par glisser-déposer ; enregistrer un filtre partagé.
- Envoyer un message, une invitation, une facture ou un paiement ; soumettre ou approuver une note de frais.
- Exécuter une commande, un reset, une API de mutation, ou modifier les accès et paramètres.
agent_instructions: "Reste uniquement dans l’onglet Odoo déjà ouvert sur holo-rich.localhost:18091 et dans la société\
  \ Holo — Déjà Bu Démo · DONNÉES FICTIVES. Si l’origine, la société ou le document est ambigu, arrête-toi sans\
  \ saisir d’identifiant. Les clics de navigation et les filtres temporaires sont autorisés ; toute modification\
  \ métier est interdite. \n\nRetrouve la commande par sa Référence fournisseur exacte DEMO-ACHAT-029. Ouvre ses\
  \ réceptions et distingue celle terminée du reliquat encore ouvert, en lisant les liens et états. Les numéros\
  \ WH/IN ne sont pas connus à l’avance. Ouvre le reliquat lié, lis ses produits et quantités demandées restantes.\
  \ Ne prends pas un transfert indépendant. Ne modifie pas les quantités, ne réserve ni ne valide quoi que ce soit.\
  \ Laisse ce reliquat visible."
postcondition:
  description: La bonne fiche ou liste est accessible et les critères ont été relus dans la seule démo enrichie.
  checks:
  - key: correct_environment
    prompt: Le navigateur est sur holo-rich.localhost:18091 et la société Holo — Déjà Bu Démo · DONNÉES FICTIVES
      est identifiable.
  - key: linked_order
    prompt: Le transfert ouvert est relié à la commande dont la référence fournisseur est DEMO-ACHAT-029.
  - key: open_backorder
    prompt: Ce transfert est un reliquat non terminé, relié à une réception terminée ; ces liens sont visibles.
  - key: remaining_quantities
    prompt: Les demandes restantes de ce reliquat sont de 9 unités par ligne, avec les produits lisibles.
  verification_instructions: 'Vérifie en lecture seule l’origine holo-rich.localhost:18091 et la société Holo —
    Déjà Bu Démo · DONNÉES FICTIVES, puis les critères ci-dessous dans les écrans correspondants. Les attentes ne
    sont pas des preuves : toute donnée absente, illisible ou différente produit false. Tu peux naviguer pour relire
    mais jamais modifier un champ ou un état. Ne déduis pas la réussite du résumé de l’acteur. Ces contrôles portent
    sur les écrans ; une revue humaine de la trace reste nécessaire pour évaluer la fidélité et l’utilité de la
    réponse, ainsi que l’absence de mutation sur tout le parcours.'
escalation:
  when:
  - L’origine, la société, la référence, une permission ou un champ ne peut pas être identifié sans ambiguïté.
  - Une action interdite serait nécessaire ou la postcondition reste non vérifiée après cet essai.
  decision_expected: L’opérateur doit vérifier la fiche, l’accès ou le critère manquant ; aucune réparation ni changement
    de périmètre automatique.
  default_category: unknown
