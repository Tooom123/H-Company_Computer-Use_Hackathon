[project]
name = "hcs-backend"
version = "0.1.0"
description = "Support backend: cases, escalation files, grouping and dashboard for the customer-success assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hcs-backend = "hcs_backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28",
]
