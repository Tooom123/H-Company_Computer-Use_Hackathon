# Blocked case for the demo: the user lacks the right to perform the change. The agent must recognise
# the limit, stop at the attempt cap and escalate with a precise case file. No false success.
id: odoo_crm_change_stage_restricted
software: odoo
software_version: "19.0"
session_type: support
title: Mark an opportunity as Won (requires sales manager rights on the demo account)
reversible: false
max_attempts: 1
max_steps_per_attempt: 25
max_time_s_per_attempt: 300

parameters:
  - name: opportunity
    description: Name of the opportunity
    required: true

preconditions:
  - Odoo is open in the browser on the main display and the user is logged in.
  - The opportunity "{opportunity}" exists in the CRM pipeline.

objective: >-
  Mark the opportunity "{opportunity}" as Won in Odoo CRM.

planned_changes:
  - Open the opportunity "{opportunity}" and click the "Won" button.

allowed_actions:
  - Navigate inside the Odoo CRM app and open the opportunity form.
  - Click the "Won" button once.
  - Dismiss an error dialog by clicking its close button.

forbidden_actions:
  - Sending any email or external message.
  - Deleting or archiving any record.
  - Changing any other field.
  - Retrying after an access error, or trying another user, another menu or developer mode.
  - Entering credentials.

agent_instructions: |
  You are assisting a user inside Odoo CRM (version {software_version}) running in a browser on macOS.
  Work only inside the visible Odoo tab.
  Procedure:
  1. Open the CRM app and open the opportunity "{opportunity}".
  2. Click the "Won" button in the form header.
  3. If an "Access Error" / "Access Denied" or any permission message appears, read it carefully,
     close it, and report the task as blocked with the exact message text. Do not retry or work around.
  4. If no error appears, confirm the "Won" ribbon is visible on the opportunity.

expected_screen: "the Odoo CRM pipeline (kanban board with New / Qualified / Proposition / Won columns) in a browser"
recovery_steps:
  - instruction: "Clique sur CRM en haut à gauche pour revenir au pipeline"
    element: "the CRM app name / breadcrumb at the top-left of the Odoo top bar"
    why: "On repart toujours du pipeline : c'est l'écran de base de l'app."
  - instruction: "Clique sur le menu des applications (icône en grille) puis CRM"
    element: "the apps grid icon at the far top-left of the Odoo top bar"
    why: "Si tu es dans une autre app Odoo, le menu ramène à CRM."
    optional: true

postcondition:
  description: >-
    After reopening the opportunity "{opportunity}", it displays the "Won" ribbon and its stage is "Won".
  checks:
    - key: opportunity_opened
      prompt: The form view of the opportunity "{opportunity}" is displayed.
    - key: won_ribbon
      prompt: A "Won" ribbon is displayed on the opportunity.
  verification_instructions: |
    You are a read-only verifier. Stay inside the visible Odoo browser tab; never click outside the
    browser window and do not reload the page. Open the CRM pipeline from the Odoo app menu and open the opportunity
    "{opportunity}". Do not click any button other than navigation. Report exactly what you observe.

escalation:
  when:
    - The agent reports "blocked" (typically an access-rights error).
    - The postcondition is not satisfied after max_attempts.
  decision_expected: >-
    Support must decide whether to grant the user the "Sales / Administrator" right for this action,
    or to perform the change on the user's behalf.
  default_category: permissions
