# Starter case: create an opportunity in the CRM pipeline. Three steps, works on an empty database.
id: odoo_crm_create_opportunity
software: odoo
software_version: "20.0"
session_type: onboarding
title: Create an opportunity in the CRM pipeline
reversible: true
max_attempts: 2
max_steps_per_attempt: 25
max_time_s_per_attempt: 300

parameters:
  - name: opportunity
    description: Name of the opportunity to create, e.g. "Acme Demo"
    required: false
    default: "Acme Demo"
  - name: expected_revenue
    description: Expected revenue, e.g. "5000"
    required: false

preconditions:
  - Odoo is open in the browser on the main display and the user is logged in.
  - The CRM app is installed.

objective: >-
  Create an opportunity named "{opportunity}" in the "New" column of the Odoo CRM pipeline.

planned_changes:
  - Add one opportunity card titled "{opportunity}" in the pipeline. Nothing else is modified.

allowed_actions:
  - Navigate inside the Odoo CRM app (open the app, pipeline view).
  - Click "New", fill the quick-create card (title, optional revenue) and click "Add".

forbidden_actions:
  - Sending any email or external message.
  - Deleting, archiving or editing any existing record.
  - Leaving the Odoo browser tab or opening other applications.
  - Entering credentials. If a login screen appears, stop and report it.

agent_instructions: |
  You are assisting a user inside Odoo CRM (version {software_version}) running in a browser on macOS.
  Work only inside the Odoo tab that is already visible.
  Procedure:
  1. Open the CRM app if the pipeline is not displayed (Odoo logo at the top-left, then "CRM").
  2. In the pipeline, click the "New" button (top-left, left of "Generate").
  3. A quick-create card opens at the top of the "New" column. The cursor starts in "Contact": do NOT type there.
     Click the second line, placeholder "Opportunity's Name", and type "{opportunity}".
     If an expected revenue was given, type it on the line with the money icon (0.00 €).
  4. Click "Add" (or press Enter). The card is saved and an empty quick-create card reopens: press Escape to close it.
     Confirm the card "{opportunity}" is visible in the "New" column.
  If something prevents a step (login prompt, error dialog), stop and report it as blocked with the exact message.

# Scripted guide: the service knows the app. Holo only locates each control on the user's screen.
# Checked live on Odoo 20 (h-companion.odoo.com, 2026-11-07).
guide_steps:
  - instruction: "Ouvre l'application CRM"
    element: "the CRM app icon or menu entry"
    why: "C'est l'application où vivent tes opportunités commerciales."
    optional: true
  - instruction: "Clique sur New"
    element: "the New button at the top-left of the CRM pipeline, left of the Generate dropdown"
    why: "Ça ouvre une petite carte pour créer une opportunité directement dans la colonne New."
    done_when: "a quick-create card is open at the top of the New column, with the fields Contact and Opportunity's Name"
  # One step for name + Add: Enter in the name field already saves the card, and the card then reopens empty,
  # so a separate "click Add" step would point at an empty card.
  - instruction: "Clique sur « Opportunity's Name » et tape « {opportunity} », puis Entrée"
    kind: type
    element: "the Opportunity's Name field (second line, briefcase icon) of the quick-create card in the New column"
    why: "Le curseur démarre dans Contact : écris bien sur la 2e ligne. Entrée (ou Add) enregistre la carte."
    annotations:
      - element: "the Contact field (first line, person icon) of the quick-create card"
        text: "Pas ici : c'est le client"
        shape: label
      - element: "the Add button at the bottom-left of the quick-create card"
        text: "ou Add"
        shape: label
    done_when: "the New column of the pipeline contains a saved card titled {opportunity} (not only text typed in the open quick-create form)"

expected_screen: "the Odoo CRM pipeline (kanban board with New / Qualified / Proposition / Won columns) in a browser"
recovery_steps:
  - instruction: "Clique sur Pipeline (ou CRM) en haut à gauche"
    element: "the Pipeline breadcrumb link, or the CRM app name, at the top-left of the Odoo page"
    why: "On repart toujours du pipeline : c'est l'écran de base de l'app."
  - instruction: "Clique sur le logo Odoo en haut à gauche, puis sur CRM"
    element: "the colored Odoo logo (home menu) at the far top-left of the Odoo top bar, left of the app name"
    why: "Si tu es dans une autre app Odoo, le menu d'accueil ramène à CRM."
    optional: true

postcondition:
  description: >-
    The CRM pipeline shows a card titled "{opportunity}" in the "New" column.
  checks:
    - key: pipeline_displayed
      prompt: The CRM pipeline (kanban with New / Qualified / Proposition / Won columns) is displayed.
    - key: card_present
      prompt: A card titled "{opportunity}" is visible in the pipeline.
  verification_instructions: |
    You are a read-only verifier. Stay inside the visible Odoo browser tab; never click outside the
    browser window and do not reload the page. Make sure the CRM pipeline is displayed (open the CRM app from
    the app menu if needed). Do not create, edit or delete anything. Report exactly what you observe.

escalation:
  when:
    - The agent reports "blocked".
    - The postcondition is not satisfied after max_attempts.
  decision_expected: >-
    Support must confirm the user has the CRM access right to create opportunities.
  default_category: unknown
