# Richer onboarding case: qualify an opportunity. Several fields, a stage change, explanations of the
# pipeline logic. Reversible (stage and values can be edited back).
id: odoo_crm_qualify_opportunity
software: odoo
software_version: "20.0"
session_type: onboarding
title: Qualify an opportunity (revenue, probability, stage)
reversible: true
max_attempts: 2
max_steps_per_attempt: 45
max_time_s_per_attempt: 480

parameters:
  - name: opportunity
    description: Name of the opportunity
    required: false
    default: "Acme Demo"
  - name: expected_revenue
    description: Expected revenue, e.g. "12000"
    required: false
    default: "12000"
  - name: customer
    description: Customer name to link, e.g. "Acme Corp"
    required: false
    default: "Acme Corp"

preconditions:
  - Odoo is open in the browser on the main display and the user is logged in.
  - The opportunity "{opportunity}" exists in the CRM pipeline.

objective: >-
  Qualify the opportunity "{opportunity}": set the contact "{customer}", the expected revenue {expected_revenue},
  and move it to the "Qualified" stage.

planned_changes:
  - Open the opportunity "{opportunity}" and set Contact = "{customer}", Expected Revenue = {expected_revenue}.
  - Move the opportunity from "New" to "Qualified". Nothing else is modified.

allowed_actions:
  - Navigate inside the Odoo CRM app and open the opportunity form.
  - Edit the Contact and Expected Revenue fields; click the "Qualified" stage in the status bar; save.

forbidden_actions:
  - Sending any email or external message.
  - Deleting or archiving any record.
  - Marking the opportunity as Won or Lost.
  - Leaving the Odoo browser tab or opening other applications.
  - Entering credentials.

agent_instructions: |
  You are assisting a user inside Odoo CRM (version {software_version}) in a browser on macOS. Work only inside
  the visible Odoo tab.
  Procedure:
  1. Open the CRM pipeline and click the card "{opportunity}" to open its form.
  2. In the "Contact" field (placeholder "Select or create a contact..."; Odoo 20 has no "Customer" label), type
     "{customer}". Pick the existing contact "{customer}" if listed; otherwise pick Create "{customer}".
     Never pick an upper-case suggestion from the external directory (e.g. "ACME ... CORPORATION, city").
  3. In "Expected Revenue" (the amount under the title), type {expected_revenue}.
  4. In the stage bar at the top of the form (New / Qualified / Proposition / Won), click "Qualified".
  5. Click the cloud save icon next to the breadcrumb if it is shown. Confirm the stage shows "Qualified".
  If something prevents a step, stop and report it as blocked with the exact message.

# Checked live on Odoo 20 (h-companion.odoo.com, 2026-11-07): "Customer" is now "Contact", the chatter sits
# on the right of the form, and the cloud save icon stays visible after a stage change until clicked.
guide_steps:
  - instruction: "Click the card \"{opportunity}\""
    element: "the pipeline card titled {opportunity}"
    why: "You always qualify from the record: that is where the deal's information lives."
    annotations:
      - element: "the word New, title of the first pipeline column, above its progress bar"
        text: "New = not qualified yet"
        shape: underline
      - element: "the word Qualified, title of the second pipeline column, above its progress bar"
        text: "Qualified = need + budget confirmed"
        shape: underline
    done_when: "the form view of the opportunity {opportunity} is open (large title {opportunity}, Won and Lost buttons, stage bar)"
  - instruction: "Look at the record: three areas matter to qualify"
    why: "Top = how much and who; stage bar = where the deal stands; right panel = the history."
    annotations:
      - element: "the Expected Revenue amount under the opportunity title"
        text: "Expected amount"
        shape: circle
      - element: "the stage bar at the top of the form showing New, Qualified, Proposition, Won"
        text: "Pipeline stages"
        shape: box
      - element: "the chatter panel on the right of the form, with Send message, Log note and Activity"
        text: "History + notes"
        shape: box
  - instruction: "Type \"{customer}\" in Contact"
    kind: type
    element: "the Contact field, right of the Contact label, in the opportunity form under Expected Revenue"
    why: "Linking a customer groups all their deals and invoices together."
  - instruction: "Pick \"{customer}\" in the list"
    element: "the option {customer} in the dropdown under the Contact field (the existing contact, else Create \"{customer}\")"
    why: "If it already exists, pick it: Create would make a duplicate. Avoid UPPERCASE suggestions: external directory."
    optional: true
    done_when: "the Contact field of the opportunity form shows {customer} and no dropdown is open"
  - instruction: "Enter {expected_revenue} in Expected Revenue"
    kind: type
    element: "the Expected Revenue amount field (large number with €) under the opportunity title"
    why: "This amount feeds the team's sales forecast."
    done_when: "the Expected Revenue field shows {expected_revenue} (possibly formatted, e.g. 12,000.00 €)"
  - instruction: "Click Qualified in the stage bar"
    element: "the Qualified stage in the stage bar at the top of the opportunity form"
    why: "Changing the stage here moves the card in the pipeline; it is reversible."
    annotations:
      - element: "the Won button at the top-left of the opportunity form"
        text: "Not Won: it closes the deal"
        shape: label
    done_when: "the stage bar of the opportunity form highlights Qualified"
  - instruction: "Click the save icon (cloud)"
    element: "the cloud-shaped save icon right of the breadcrumb Pipeline / {opportunity} at the top-left"
    why: "Without this click the changes stay pending and can be lost."
    optional: true
    done_when: "the form is saved: right of the breadcrumb there is just the ⋮ menu (an unsaved form would also show a cloud icon and an X there)"

expected_screen: "the Odoo CRM pipeline (kanban board with New / Qualified / Proposition / Won columns) in a browser"
recovery_steps:
  - instruction: "Click Pipeline (or CRM) at the top left"
    element: "the Pipeline breadcrumb link, or the CRM app name, at the top-left of the Odoo page"
    why: "We always restart from the pipeline: the app's home screen."
  - instruction: "Click the Odoo logo at the top left, then CRM"
    element: "the colored Odoo logo (home menu) at the far top-left of the Odoo top bar, left of the app name"
    why: "If you are in another Odoo app, the home menu brings you back to CRM."
    optional: true

postcondition:
  description: >-
    After reopening the opportunity "{opportunity}", its stage is "Qualified", the customer is "{customer}"
    and the expected revenue is {expected_revenue}.
  checks:
    - key: opportunity_opened
      prompt: The form view of the opportunity "{opportunity}" is displayed.
    - key: stage_qualified
      prompt: The stage bar highlights "Qualified".
    - key: customer_set
      prompt: The Contact field shows "{customer}".
    - key: revenue_set
      prompt: The Expected Revenue field shows {expected_revenue} (formatted amounts like 12,000.00 count).
  verification_instructions: |
    You are a read-only verifier. Stay inside the visible Odoo browser tab; never click outside the browser
    window and do not reload the page. Open the CRM pipeline from the app menu if needed and open the opportunity
    "{opportunity}". Do not create, edit or delete anything. Report exactly what you observe.

escalation:
  when:
    - The agent reports "blocked".
    - The postcondition is not satisfied after max_attempts.
  decision_expected: >-
    Support must confirm the user may edit opportunities and change stages (Sales user rights).
  default_category: unknown
