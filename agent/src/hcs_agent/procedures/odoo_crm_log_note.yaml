# Usage case with a real trap: "Log note" (internal) vs "Send message" (emails the customer).
id: odoo_crm_log_note
software: odoo
software_version: "20.0"
session_type: onboarding
title: Log an internal note on an opportunity (without emailing the customer)
reversible: true
max_attempts: 2
max_steps_per_attempt: 30
max_time_s_per_attempt: 300

parameters:
  - name: opportunity
    description: Name of the opportunity
    required: false
    default: "Acme Demo"
  - name: note
    description: Text of the internal note
    required: false
    default: "Appel de découverte fait, budget confirmé."

preconditions:
  - Odoo is open in the browser on the main display and the user is logged in.
  - The opportunity "{opportunity}" exists in the CRM pipeline.

objective: >-
  Log the internal note "{note}" on the opportunity "{opportunity}" without sending any message to the customer.

planned_changes:
  - Add one internal note in the chatter of "{opportunity}". No email, no stage change.

allowed_actions:
  - Navigate inside the Odoo CRM app and open the opportunity form.
  - Click "Log note", type the note, click "Log".

forbidden_actions:
  - Clicking "Send message" or sending any email.
  - Deleting or archiving any record.
  - Changing any field of the opportunity.
  - Leaving the Odoo browser tab or opening other applications.

agent_instructions: |
  You are assisting a user inside Odoo CRM (version {software_version}) in a browser on macOS. Work only inside
  the visible Odoo tab.
  Procedure:
  1. Open the CRM pipeline and click the card "{opportunity}".
  2. In the chatter (panel on the right of the form on a wide screen, below it on a narrow one), click
     "Log note" — NOT "Send message", which emails the followers.
  3. A composer with the placeholder "Log an internal note..." opens: type "{note}" and click "Log".
  4. Confirm the note appears at the top of the chatter history.
  If something prevents a step, stop and report it as blocked with the exact message.

# Checked live on Odoo 20 (h-companion.odoo.com, 2026-11-07).
guide_steps:
  - instruction: "Clique sur la carte « {opportunity} »"
    element: "the pipeline card titled {opportunity}"
    why: "Les notes se mettent sur la fiche, pour que toute l'équipe les voie au bon endroit."
    done_when: "the form view of the opportunity {opportunity} is open (large title {opportunity}, chatter with Send message and Log note)"
  - instruction: "Clique sur Log note (pas Send message)"
    element: "the Log note button at the top of the chatter panel, between Send message and Activity"
    why: "Log note = interne, visible par l'équipe seulement. Send message = envoie un e-mail au client."
    annotations:
      - element: "the Send message button at the top of the chatter panel"
        text: "Envoie un e-mail au client !"
        shape: box
    done_when: "the chatter shows a composer with the placeholder 'Log an internal note...' and a Log button"
  - instruction: "Écris « {note} »"
    kind: type
    element: "the 'Log an internal note...' text box in the chatter"
    why: "Sois factuel : qui, quoi, prochaine étape. Tu peux mentionner un collègue avec @."
    done_when: "the internal note composer in the chatter contains the text {note}"
  - instruction: "Clique sur Log"
    element: "the Log button just under the internal note composer in the chatter"
    why: "La note est horodatée et attachée à l'affaire, sans rien envoyer au client."
    done_when: "the chatter history shows a new entry {note} and the note composer is closed"

expected_screen: "the Odoo CRM pipeline (kanban board with New / Qualified / Proposition / Won columns) in a browser"
recovery_steps:
  - instruction: "Clique sur Pipeline (ou CRM) en haut à gauche"
    element: "the Pipeline breadcrumb link, or the CRM app name, at the top-left of the Odoo page"
    why: "On repart toujours du pipeline : c'est l'écran de base de l'app."
  - instruction: "Clique sur le logo Odoo en haut à gauche, puis sur CRM"
    element: "the colored Odoo logo (home menu) at the far top-left of the Odoo top bar, left of the app name"
    why: "Si tu es dans une autre app Odoo, le menu d'accueil ramène à CRM."
    optional: true

postcondition:
  description: >-
    The chatter of "{opportunity}" shows an internal note containing "{note}", and no message was sent.
  checks:
    - key: opportunity_opened
      prompt: The form view of the opportunity "{opportunity}" is displayed.
    - key: note_present
      prompt: The chatter shows a note containing "{note}".
    - key: internal_styling
      prompt: >-
        That entry is an internal note, not a sent message: in Odoo 20 a note is plain text in the history
        (no speech bubble, no envelope icon, no "To:" recipients line).
  verification_instructions: |
    You are a read-only verifier. Stay inside the visible Odoo browser tab; never click outside the browser
    window and do not reload the page. Open the opportunity "{opportunity}" from the CRM pipeline. Scroll the
    chatter if needed. Do not create, edit or delete anything. Report exactly what you observe.

escalation:
  when:
    - The agent reports "blocked".
    - The postcondition is not satisfied after max_attempts.
  decision_expected: >-
    Support must check whether the user has access to the chatter of this record.
  default_category: unknown
